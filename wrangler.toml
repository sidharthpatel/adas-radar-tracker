name = "radar-tracker"
compatibility_date = "2026-10-01"
main = "worker.js"
account_id = "817829d80d62c6ed685c04ed53dbaf11"

routes = [
  { pattern = "sidharthpatel.com/projects/radar-tracker*", zone_name = "sidharthpatel.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# This app has no client-side routing, so a missing asset should be a real
# 404 — not silently masked as a 200 serving index.html, which makes a truly
# missing file indistinguishable (from the browser's perspective) from one
# that loaded fine, and is why a failed model load surfaced as a confusing
# "HTML is not valid JSON" error instead of a plain 404.
not_found_handling = "404-page"
